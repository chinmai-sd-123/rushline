[project]
name = "rushline"
version = "0.1.0"
description = "Seat booking backend that stays correct under a Tatkal-style rush"
readme = "README.md"
authors = [
    { name = "Chinmai S D", email = "chinmaisdinesh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "I",
    "F",
    "B",
    "UP",
]
