services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rushline
      POSTGRES_PASSWORD: rushline
      POSTGRES_DB: rushline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushline -d rushline"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5m
    
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: